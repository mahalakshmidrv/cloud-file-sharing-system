{% extends "base.html" %}
{% block title %}Activity{% endblock %}
{% block content %}
<h1>Activity log</h1>
<section class="card">
  {% if rows %}
  <div class="table-wrap">
  <table>
    <thead><tr><th>When</th><th>Action</th><th>Details</th></tr></thead>
    <tbody>
    {% for r in rows %}
      <tr>
        <td>{{ r['created_at']|pretty_time }}</td>
        <td><span class="pill info">{{ r['action'] }}</span></td>
        <td>{{ r['detail'] }}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
  </div>
  {% else %}<p class="muted">No activity yet.</p>{% endif %}
</section>
{% endblock %}
